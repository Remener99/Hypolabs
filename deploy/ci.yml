name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Start server and run UI tests
        run: |
          node --disable-warning=ExperimentalWarning server/index.js &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health > /dev/null; then echo "server up"; break; fi
            sleep 1
          done
          npm run test:ui
          kill $SERVER_PID
